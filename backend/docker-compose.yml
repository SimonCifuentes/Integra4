services:
  api:
    # Arranca con Gunicorn (multiproceso)
    command: bash -c "chmod +x /app/scripts/start_gunicorn.sh && /app/scripts/start_gunicorn.sh"
    environment:
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-0}"      # 0 => CPU*2+1
      GUNICORN_TIMEOUT: "${GUNICORN_TIMEOUT:-60}"
      GUNICORN_GRACEFUL_TIMEOUT: "${GUNICORN_GRACEFUL_TIMEOUT:-30}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
